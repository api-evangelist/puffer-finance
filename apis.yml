name: Puffer Finance
description: 'Puffer Finance is an Ethereum infrastructure protocol building native
  liquid restaking (nLRP) integrated with EigenLayer, the UniFi based rollup, and
  Puffer Preconf preconfirmation services. Users stake ETH to mint the pufETH liquid
  restaking token and earn Ethereum staking plus EigenLayer and Puffer restaking yields.
  Puffer also ships institutional-grade staking infrastructure. It is an onchain,
  smart-contract protocol: developers integrate via its Solidity contracts, the
  first-party TypeScript puffer-sdk, and the Rust coral CLI rather than a hosted
  web API. Surfaced as a portfolio company of electric-capital and enriched in the
  API Evangelist network.'
